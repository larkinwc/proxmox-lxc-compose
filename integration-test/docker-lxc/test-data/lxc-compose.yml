version: "3"
services:
  web:
    image: "ubuntu:20.04"
    network:
      type: "bridge"
      bridge: "lxcbr0"
      ip: "10.0.3.100/24"
      gateway: "10.0.3.1"
      dns:
        - "8.8.8.8"
        - "8.8.4.4"
    storage:
      root: "1G"
      backend: "dir"
    security:
      privileged: false
    cpu:
      cores: 1
    memory:
      limit: "512M"
    environment:
      TEST_VAR: "integration_test"
    # Remove custom command to use default init system

  db:
    image: "ubuntu:20.04"
    network:
      type: "bridge"
      bridge: "lxcbr0"
      ip: "10.0.3.101/24"
      gateway: "10.0.3.1"
    storage:
      root: "2G"
      backend: "dir"
    security:
      privileged: false
    memory:
      limit: "1G"
    environment:
      DB_TYPE: "test"