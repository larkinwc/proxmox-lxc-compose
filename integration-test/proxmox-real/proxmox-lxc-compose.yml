# Real Proxmox LXC configuration for testing
services:
  web-server:
    image: "ubuntu:22.04"  # This would be a Proxmox LXC template
    network:
      type: "bridge"
      bridge: "vmbr0"  # Proxmox default bridge
      ip: "192.168.1.100/24"
      gateway: "192.168.1.1"
      dns:
        - "8.8.8.8"
        - "1.1.1.1"
    storage:
      root: "8G"
      backend: "zfs"  # or "dir" depending on Proxmox storage
      pool: "local-zfs"  # Proxmox storage pool
    security:
      isolation: "default"
      privileged: false
      capabilities:
        - "NET_ADMIN"  # For network configuration
    cpu:
      cores: 2
      shares: 1024
    memory:
      limit: "2G"
      swap: "1G"
    environment:
      DEBIAN_FRONTEND: "noninteractive"
      TZ: "UTC"
    # Proxmox-specific options
    proxmox:
      node: "pve"  # Proxmox node name
      vmid: 200    # Specific VM ID
      template: "ubuntu-22.04-standard_22.04-1_amd64.tar.zst"
      
  database:
    image: "ubuntu:22.04"
    network:
      type: "bridge"
      bridge: "vmbr0"
      ip: "192.168.1.101/24"
      gateway: "192.168.1.1"
    storage:
      root: "20G"
      backend: "zfs"
      pool: "local-zfs"
      mounts:
        - source: "/mnt/data"
          target: "/var/lib/mysql"
          type: "bind"
    security:
      isolation: "strict"
    cpu:
      cores: 4
    memory:
      limit: "4G"
    proxmox:
      node: "pve"
      vmid: 201
      template: "ubuntu-22.04-standard_22.04-1_amd64.tar.zst"